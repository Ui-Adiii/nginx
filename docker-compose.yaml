services:
  nginx:
    image: nginx:stable-trixie-perl
    ports:
      - "8080:80"
    container_name: nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
  server1:
    build: ./backend
    ports:
      - 5001:5000
    container_name: server1
    environment:
      - SERVER_NAME=server1
  server2:
    build: ./backend
    ports:
      - 5002:5000
    container_name: server2
    environment:
      - SERVER_NAME=server2
  server3:
    build: ./backend
    ports:
      - 5003:5000
    container_name: server3
    environment:
      - SERVER_NAME=server3

       